<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hangar Hover | Night Watch</title>
<link rel="stylesheet" href="styles.css">

<main>
<header><div><span class="kicker">Night Watch / Underground Surveillance</span><h1>HANGAR <em>HOVER</em></h1></div><div class="header-tools"><span id="campaign"></span><button id="audio" aria-pressed="false">Sound off</button></div></header>
<nav class="pages" aria-label="Game pages">
<button data-page="flight" aria-pressed="true">01 Flight</button><button data-page="missions" aria-pressed="false">02 Missions</button><button data-page="hangar" aria-pressed="false">03 Hangar</button><button data-page="upgrades" aria-pressed="false">04 Upgrades</button>
</nav>
<div class="layout"><section id="page-flight" aria-label="Flight deck">
<div class="hud"><span id="power">Battery <meter min="0" max="100" value="100"></meter> <b>100%</b></span><span id="gates"></span><span id="time"></span><span id="best"></span><span id="alert"></span><span id="jamStatus"></span></div>
<div id="field">
<canvas width="960" height="500" aria-label="Top-down drone obstacle course"></canvas>
<div class="overlay"><div class="card"><h2 id="headline"></h2><p id="brief"></p><button id="action"></button></div></div>
</div>
<div class="camera-legend"><span class="friendly">● Green · safe feed</span><span class="hostile">◆ Red · battery drain</span></div>
<div class="help"><span>WASD / arrows to fly · Space to brake · C to jam · P to pause · R to restart</span><div class="keys" aria-label="Touch flight controls"><button data-key="ArrowLeft" aria-label="Fly left">←</button><button data-key="ArrowUp" aria-label="Fly up">↑</button><button data-key="ArrowDown" aria-label="Fly down">↓</button><button data-key="ArrowRight" aria-label="Fly right">→</button><button data-key=" " aria-label="Brake">Brake</button><button id="jam" aria-label="Jam cameras">Jam</button><button id="pause" aria-label="Pause or resume">Pause</button></div></div>
</section>
<section id="page-missions" class="panel game-menu" hidden>
<h2>Missions</h2><nav id="mission-list" aria-label="Mission list"></nav>
<div class="pager"><button id="prevMission">Previous</button><output id="missionPage"></output><button id="nextMission">Next</button></div>
</section>
<section id="page-hangar" class="panel game-menu" hidden><h2>Drone hangar</h2><canvas id="loadout" width="440" height="168" aria-label="Selected drone illustration"></canvas><div id="fleet"></div></section>
<section id="page-upgrades" class="panel game-menu" hidden><h2 id="upgradeTitle">Upgrades</h2><output id="funds"></output><div id="mods"></div></section>
</div>
</main>
<script src="game.js"></script>
